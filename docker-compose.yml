services:
  krakend:
    image: devopsfaith/krakend
    container_name: krakend
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8082:8082"
    volumes:
      - ./krakend.json:/etc/krakend/krakend.json
      - ./keys.json:/etc/krakend/keys.json
    command: run -c /etc/krakend/krakend.json
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"